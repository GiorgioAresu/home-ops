frr version 10.7
frr defaults traditional
hostname truenas-frr
log stdout
no ipv6 forwarding
!
router bgp 64515
 bgp router-id 10.17.1.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.17.1.1 remote-as 64513
 !
 address-family ipv4 unicast
  network 10.1.1.21/32
 exit-address-family
exit
!
line vty
!
