---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: openwebui
spec:
  kanidmRef:
    name: kanidm
  displayname: Open WebUI
  origin: https://chat.aresu.eu/oauth/oidc/callback
  redirectUrl: []
  scopeMap:
    - group: openwebui_users@idm.aresu.eu
      scopes:
        - openid
        - profile
        - email
  strictRedirectUrl: true
  allowInsecureClientDisablePkce: true
  disableConsentPrompt: true
