---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: zot
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Zot
  origin: https://registry.aresu.eu/
  redirectUrl:
    - https://registry.aresu.eu/zot/auth/callback/oidc
  scopeMap:
    - group: registry_ui_users@idm.aresu.eu
      scopes:
        - openid
        - profile
        - email
        - groups
  strictRedirectUrl: true
  allowInsecureClientDisablePkce: true
  disableConsentPrompt: true
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: registry-ui-users
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: registry_ui_users
  members:
    - giorgio@idm.aresu.eu
