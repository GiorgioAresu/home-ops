---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: registry-ui
spec:
  kanidmRef:
    name: kanidm
  displayname: Registry UI
  origin: https://registry.aresu.eu/
  redirectUrl:
    - https://registry.aresu.eu/oauth/callback
  scopeMap:
    - group: registry-ui-users@idm.aresu.eu
      scopes:
        - openid
        - profile
        - email
        - groups
  claimMap:
    - name: registry_ui_groups
      valuesMap:
        - group: registry-ui-users@idm.aresu.eu
          values:
            - registry-ui-users
      joinStrategy: array
  strictRedirectUrl: true
  allowInsecureClientDisablePkce: true
  disableConsentPrompt: true
