---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 30m
  values:
    networkpolicies:
      jellyfin:
        type: cilium
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: bazarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: lidarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: homepage
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
    controllers:
      jellyfin:
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: jellyfin-gpu
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
          # jellyfin/jellyfin#17831: default 30s can SIGKILL the shutdown VACUUM+ANALYZE on v12
          terminationGracePeriodSeconds: 120
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
            env:
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_PublishedServerUrl: https://jellyfin.aresu.eu
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
              limits:
                memory: 3Gi
    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      metadata:
        size: 10Gi
        accessMode: ReadWriteOnce
        storageClass: miroir-local
        suffix: "metadata"
        globalMounts:
          - path: /metadata
            subPath: metadata
          - path: /config/data/introskipper
            subPath: introskipper
      media:
        type: nfs
        server: truenas.aresu.eu
        path: /mnt/tank/media
        advancedMounts:
          jellyfin:
            app:
              - path: /data/media
      tmpfs:
        type: emptyDir
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
                subPath: cache
              - path: /tmp
                subPath: tmp
              - path: /transcode
                subPath: transcode
    route:
      app:
        hostnames:
          - jellyfin.aresu.eu
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.1.217
        externalTrafficPolicy: Local
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
