---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 30m
  values:
    externalSecrets:
      immich:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              # Immich
              DB_DATABASE_NAME: &dbname immich
              DB_HOSTNAME: &dbhost postgres-rw.database.svc.cluster.local
              DB_USERNAME: &dbuser "{{ .POSTGRES_USER }}"
              DB_PASSWORD: &dbpass "{{ .POSTGRES_PASSWORD }}"
              JWT_SECRET: "{{ .JWT_SECRET }}"
              # Postgres Init
              INIT_POSTGRES_DBNAME: *dbname
              INIT_POSTGRES_HOST: *dbhost
              INIT_POSTGRES_USER: *dbuser
              INIT_POSTGRES_PASS: *dbpass
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: immich
          - extract:
              key: cloudnative-pg
    networkpolicies:
      immich-server:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/instance: immich
            app.kubernetes.io/service: immich-server
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "2283"
                    protocol: TCP
      immich-redis:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/instance: immich
            app.kubernetes.io/service: immich-redis
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: immich
                  app.kubernetes.io/instance: immich
                  app.kubernetes.io/controller: server
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
      immich-machine-learning:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/instance: immich
            app.kubernetes.io/service: immich-machine-learning
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: immich
                  app.kubernetes.io/instance: immich
                  app.kubernetes.io/controller: machine-learning
            toPorts:
              - ports:
                  - port: "3003"
                    protocol: TCP
    configMaps:
      config:
        data:
          DB_PORT: "5432"
          DISABLE_REVERSE_GEOCODING: "true"
          ENABLE_MAPBOX: "false"
          LOG_LEVEL: verbose
          NODE_ENV: "production"
          REDIS_HOSTNAME: immich-redis.media.svc.cluster.local
          REDIS_PORT: "6379"
      # initdb:
      #   data:
      #     immich.sql: |-
      #       CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
      #       CREATE EXTENSION IF NOT EXISTS vector CASCADE;
    controllers:
      server:
        annotations:
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}"
          configmap.reloader.stakater.com/reload: immich-configmap
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.0@sha256:ae13784ffcfcce8f4178113eb6661602a1fd1912f3d539880b8ac0dd95fc8ac2
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
              - configMapRef:
                  identifier: config
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 4096Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      machine-learning:
        annotations:
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}"
          configmap.reloader.stakater.com/reload: immich-configmap
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
              - configMapRef:
                  identifier: config
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
      redis:
        containers:
          main:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3
            env:
              REDIS_REPLICATION_MODE: master
            command: ["redis-server"]
    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      redis:
        controller: redis
        ports:
          http:
            port: 6379
    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib
      library:
        type: nfs
        server: "truenas.aresu.eu"
        path: /mnt/tank/kubernetes/immich
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      machine-learning-cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
      # initdb:
      #   type: configMap
      #   identifier: initdb
      #   advancedMounts:
      #     server:
      #       init-db:
      #         - path: /initdb
    serviceMonitor:
      server:
        enabled: true
        serviceName: server
        endpoints:
          - port: metrics-api
            scheme: http
            path: /metrics
          - port: metrics-ms
            scheme: http
            path: /metrics
    route:
      app:
        hostnames:
          - immich.aresu.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: *port
