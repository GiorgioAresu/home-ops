---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
components:
  - ../../components/flux-alerts
  - ../../components/kopiur/secret
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
resources:
  - ./actual/ks.yaml
  - ./dococd/ks.yaml
  - ./freshrss/ks.yaml
  - ./homepage/ks.yaml
  - ./it-tools/ks.yaml
  - ./karakeep/ks.yaml
  # - ./searxng/ks.yaml
  - ./thelounge/ks.yaml
  # - ./unifi/ks.yaml
